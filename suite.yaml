ecosystem_contract_version: "1.1.0"
suite_id: "ui-ux"
repo_name: "best-ui-ux-designers"
director_slug: "design-director"
judgment_file: "DESIGN.md"
schema_version: "1.1.0"
synthesis_mode: "weighted_panel"
sdlc_scope:
  primary_artifacts:
    - "**/*.html"
    - "**/*.tsx"
    - "**/*.jsx"
    - "**/*.css"
    - "**/*.vue"
    - "**/*.svelte"
  sdlc_stages: ["plan", "design", "build", "verify"]
  explicit_out_of_scope:
    - "sre_observability"
    - "production_release_rollback"
    - "cloud_finops"
execution_modes:
  fast_pr_gate: "Run tools/uiux_cpu_scanner.py + 4 Via Negativa auditors on UI diffs; escalate to design-director on BLOCKER, new AI surface, or regime shift."
  architecture_review: "Run tools/uiux_cpu_scanner.py + design-director (4-5 active Barbell BRIEF.md panels + dialectical rebuttal + 4 auditors + Verdict Envelope v1.1.0)."
tooling:
  pre_scanner: "tools/uiux_cpu_scanner.py"
  required_tools: ["python3"]
  optional_tools: ["node"]
  accepted_formats: ["json", "sarif", "exit_code"]
  fail_closed_on_missing_required_tool: false
roster_summary:
  module_type: "expert_panel"
  total_modules: 12
  lindy_anchors: 6
  convex_frontier: 6
  auditors: 4
  regimes: 5
domain_extensions:
  - "solow_stage"
handoff_targets:
  - suite_id: "verification-eval"
    trigger_condition: "Interactive UI or agentic flow ships without independent clean-room behavioral tests, EvalOps error analysis, or deterministic state verification."
  - suite_id: "systems-harness"
    trigger_condition: "Frontend latency (>100 ms), state desynchronization, or component duplication stems from backend/state architecture or missing deterministic CI harnesses."
  - suite_id: "security-governance"
    trigger_condition: "Agentic checkpoint, permission model, credential boundary, PII handling, or regulatory audit trail crosses into security or compliance governance."
  - suite_id: "spec-context"
    trigger_condition: "UI audit reveals contradictory business rules, undefined user tasks, or ambiguous product scope requiring executable specification before redesign."
