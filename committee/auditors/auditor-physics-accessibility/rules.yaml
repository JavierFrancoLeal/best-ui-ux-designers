schema_version: "1.0.0"
auditor_slug: "auditor-physics-accessibility"
suite_id: "ui-ux"
mandate: "Block pointing/target barriers, WCAG 2.2 AA regressions, non-compositor animation jank, and missing reduced-motion parity."
rules:
  - id: "aud-phy-01"
    veto_id: "veto-wcag-contrast-and-color-only"
    name: "wcag_22_aa_contrast_color_and_aria"
    category: "visual_semiotics"
    severity: "hard_veto"
    core_invariant: "Normal text must achieve >= 4.5:1 contrast (WCAG 1.4.3), large text and UI boundaries >= 3:1 (WCAG 1.4.11), status must never rely solely on color (WCAG 1.4.1), and icon-only buttons must expose accessible names."
    target_antipattern: "Low-contrast muted labels or borders, color-only red/green status dots with zero shape or text label, and icon-only <button> elements lacking aria-label or visible text."
    detection_rule: "Inspect foreground/background color pairs, status indicators, and icon buttons: FAIL if normal_text_contrast < 4.5 OR large_or_ui_contrast < 3.0 OR color_only_status === true OR icon_only_button_missing_aria_label === true."
    threshold: "text >= 4.5:1, UI >= 3.0:1, non-color redundancy === true, accessible_name === true"
    verification_method: "static_code_audit"
    mandatory_remediation: "Adjust foreground/background tokens to meet >= 4.5:1 / >= 3.0:1 unrounded sRGB luminance ratio, pair status colors with distinct shapes + text, and add explicit aria-label or visible labels to icon controls."
    primary_sources:
      - id: "src-phy-01"
        title: "Web Content Accessibility Guidelines (WCAG) 2.2"
        author_or_org: "W3C"
        year: 2023
        source_type: "official_standard"
        url_or_identifier: "https://www.w3.org/TR/WCAG22/"
        extracted_invariant: "AA requirements: SC 1.4.1 Use of Color, SC 1.4.3 Contrast (>=4.5:1 / >=3:1), SC 1.4.11 Non-text Contrast (>=3:1)."

  - id: "aud-phy-02"
    veto_id: "veto-wcag-focus-pointer-and-fitts"
    name: "wcag_targets_focus_dragging_and_fitts_geometry"
    category: "interaction_physics"
    severity: "hard_veto"
    core_invariant: "Interactive targets must meet >= 24x24 CSS px desktop (WCAG 2.5.8) and >= 44x44 CSS px mobile touch, maintain unobstructed :focus-visible (WCAG 2.4.11), provide single-pointer alternatives to dragging (WCAG 2.5.7), and eliminate dead gaps in Fitts Shannon ID = log2(D/W + 1)."
    target_antipattern: "Tiny 16-20 px click targets, outline: none without :focus-visible, sticky headers covering focused elements, drag-only sorting/deletion with no click buttons, or non-clickable dead gaps between interactive list rows."
    detection_rule: "Inspect CSS dimensions, focus rules, scroll-margin-top, and drag handlers: FAIL if desktop_target_px < 24 OR mobile_target_px < 44 OR focus_visible_missing_or_obscured === true OR drag_without_single_pointer_alt === true OR dead_gap_between_clickable_rows === true."
    threshold: "desktop >= 24x24 px, mobile >= 44x44 px, SC 2.4.11 & 2.5.7 PASS, zero dead row gaps"
    verification_method: "static_code_audit"
    mandatory_remediation: "Enforce min-width/min-height >= 24 px desktop (>= 44 px touch), restore >= 3:1 :focus-visible rings with scroll-margin-top for sticky headers, add click/button alternatives for drag actions, and pad clickable list rows continuously."
    primary_sources:
      - id: "src-phy-01"
        title: "Web Content Accessibility Guidelines (WCAG) 2.2"
        author_or_org: "W3C"
        year: 2023
        source_type: "official_standard"
        url_or_identifier: "https://www.w3.org/TR/WCAG22/"
        extracted_invariant: "SC 2.4.11 Focus Not Obscured, SC 2.5.7 Dragging Movements, SC 2.5.8 Target Size (Minimum >= 24x24 CSS px)."
      - id: "src-phy-02"
        title: "Fitts' Law as a Research and Design Tool in Human-Computer Interaction"
        author_or_org: "I. Scott MacKenzie"
        year: 1992
        source_type: "peer_reviewed_paper"
        url_or_identifier: "Human-Computer Interaction, Vol. 7, No. 1, pp. 91-139"
        extracted_invariant: "Shannon Index of Difficulty ID = log2(D/W + 1) governs pointing speed and accuracy."

  - id: "aud-phy-03"
    veto_id: "veto-non-compositor-motion-jank"
    name: "compositor_only_motion_blur_and_duration_ceiling"
    category: "interaction_physics"
    severity: "hard_veto"
    core_invariant: "Interactive transitions must run exclusively on GPU compositor properties (transform, opacity), prohibit transition-all and layout/paint property animation, cap dynamic blur at <= 20 px, and cap interactive durations at <= 300 ms."
    target_antipattern: "CSS transition: all / Tailwind transition-all, animating height/width/top/left/box-shadow, mutating inherited CSS custom properties on draggable containers (>10 children), dynamic backdrop-filter: blur(>20px), or >300 ms interactive reveals."
    detection_rule: "Scan CSS/Tailwind/TSX for transition: all, transition-all, animated height|width|top|left|box-shadow, inherited --* drag writes on large containers, blur(>20px), or interactive duration > 300 ms; FAIL if any forbidden pattern is found."
    threshold: "compositor_only === true, blur <= 20 px, duration <= 300 ms"
    verification_method: "static_code_audit"
    mandatory_remediation: "Replace transition-all and layout animations with explicit transform/opacity transitions <= 200-300 ms, cap dynamic blur <= 20 px, and write drag offsets directly to element refs via translate3d."
    primary_sources:
      - id: "src-phy-03"
        title: "Web Interface Guidelines & Invisible Details of Interaction Design"
        author_or_org: "Rauno Freiberg & Emil Kowalski"
        year: 2024
        source_type: "engineering_post"
        url_or_identifier: "https://rauno.me/craft/interaction-design"
        extracted_invariant: "Compositor-only transform/opacity transitions, dynamic blur <= 20 px (Safari/GPU bound), and <= 300 ms interactive ceilings prevent jank."

  - id: "aud-phy-04"
    veto_id: "veto-missing-reduced-motion"
    name: "prefers_reduced_motion_parity"
    category: "interaction_physics"
    severity: "hard_veto"
    core_invariant: "Every spatial transform, slide, scale, or CSS animation must provide a prefers-reduced-motion: reduce fallback that preserves functional state changes without vestibular motion."
    target_antipattern: "Animated drawers, popovers, springs, or parallax effects with zero @media (prefers-reduced-motion: reduce) or useReducedMotion handling."
    detection_rule: "Inspect every stylesheet or animation hook declaring transform/animation transitions; FAIL if @media (prefers-reduced-motion: reduce) or JS reduced-motion guard is absent."
    threshold: "reduced_motion_fallback === true"
    verification_method: "static_code_audit"
    mandatory_remediation: "Add @media (prefers-reduced-motion: reduce) (or useReducedMotion hook) disabling spatial displacement/scaling while preserving instant or opacity-only state visibility."
    primary_sources:
      - id: "src-phy-01"
        title: "Web Content Accessibility Guidelines (WCAG) 2.2"
        author_or_org: "W3C"
        year: 2023
        source_type: "official_standard"
        url_or_identifier: "https://www.w3.org/TR/WCAG22/"
        extracted_invariant: "Motion triggered by interaction must be disableable without breaking task functionality."
