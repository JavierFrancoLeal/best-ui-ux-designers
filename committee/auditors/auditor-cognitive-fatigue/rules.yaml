schema_version: "1.0.0"
auditor_slug: "auditor-cognitive-fatigue"
suite_id: "ui-ux"
mandate: "Block working-memory saturation, decision paralysis, motor overload, and hidden persistent modes."
rules:
  - id: "aud-cog-01"
    veto_id: "veto-cowan-chunk-overload"
    name: "cowan_working_memory_chunk_limit"
    category: "cognitive_load"
    severity: "conditional_block"
    core_invariant: "No single active decision locus may present more than 4 ungrouped competing cognitive chunks simultaneously."
    target_antipattern: "Unstructured toolbars, modal dialogs, or wizard steps dumping >= 5 ungrouped peer controls or competing metric groups without chunking hierarchy."
    detection_rule: "Count ungrouped sibling interactive control groups or competing primary task blocks inside the active focal container; FAIL if count > 4 without semantic grouping (<fieldset>, section divider, or progressive disclosure)."
    threshold: "<= 4 ungrouped chunks"
    verification_method: "static_code_audit"
    mandatory_remediation: "Group peer controls into <= 4 semantically labeled clusters or move secondary controls behind progressive disclosure."
    primary_sources:
      - id: "src-cog-01"
        title: "The Magical Number 4 in Short-Term Memory: A Reconsideration of Mental Storage Capacity"
        author_or_org: "Nelson Cowan"
        year: 2001
        source_type: "peer_reviewed_paper"
        url_or_identifier: "Behavioral and Brain Sciences, Vol. 24, No. 1, pp. 87-114"
        extracted_invariant: "Short-term working memory holds approximately 4 simultaneous chunks."

  - id: "aud-cog-02"
    veto_id: "veto-hick-choice-bloat"
    name: "hick_hyman_decision_bloat"
    category: "cognitive_load"
    severity: "conditional_block"
    core_invariant: "Critical decision surfaces must bound equiprobable choice cardinality to prevent logarithmic reaction-time inflation (RT = a + b log2(n), b ~= 150 ms/bit)."
    target_antipattern: "Flat unranked dropdowns, pricing grids, or action menus exposing > 7 equiprobable peer choices on a primary flow without defaults, grouping, or incremental search."
    detection_rule: "Inspect critical decision menus, radio groups, and step selectors; FAIL if equiprobable ungrouped options > 7 without pre-selected defaults or <= 250 ms incremental filtering."
    threshold: "<= 7 ungrouped equiprobable choices (or incremental search <= 250 ms)"
    verification_method: "static_code_audit"
    mandatory_remediation: "Reduce ungrouped critical choices via opinionated defaults, <= 4 semantic clusters, or an incremental-search command list."
    primary_sources:
      - id: "src-cog-02"
        title: "On the Rate of Gain of Information / Stimulus Information as a Determinant of Reaction Time"
        author_or_org: "W. E. Hick (1952) & Ray Hyman (1953)"
        year: 1953
        source_type: "peer_reviewed_paper"
        url_or_identifier: "Journal of Experimental Psychology, Vol. 45, No. 3, pp. 188-196"
        extracted_invariant: "Choice reaction time scales logarithmically with stimulus entropy: RT = a + b log2(n)."

  - id: "aud-cog-03"
    veto_id: "veto-baymard-form-bloat"
    name: "baymard_form_element_ceiling_and_account_wall"
    category: "conversion_ergonomics"
    severity: "conditional_block"
    core_invariant: "Capture and checkout forms must render <= 14 visible form elements by default (ideal 12-14 vs. 23.48 US mean) and must never enforce mandatory upfront account registration before delivering core value or guest checkout."
    target_antipattern: "Checkout or onboarding views exposing > 14 visible <input>/<select>/<textarea> elements by default or gating first-use flows behind mandatory account creation."
    detection_rule: "Count visible <input>, <select>, and <textarea> nodes rendered on initial mount in capture/checkout flows, and inspect route guards for mandatory pre-checkout login walls; FAIL if visible_form_elements > 14 OR mandatory_account_wall === true."
    threshold: "<= 14 visible form elements AND guest_or_gradual_entry === true"
    verification_method: "static_code_audit"
    mandatory_remediation: "Collapse optional fields (company, address line 2, coupon), combine full-name inputs, remove forced pre-checkout registration walls, and keep visible default elements <= 14."
    primary_sources:
      - id: "src-cog-03"
        title: "Checkout Usability & Cart Abandonment Rate Statistics (50-Study Meta-Benchmark)"
        author_or_org: "Baymard Institute"
        year: 2026
        source_type: "empirical_benchmark"
        url_or_identifier: "https://baymard.com/lists/cart-abandonment-rate"
        extracted_invariant: "70.22% average abandonment; reducing checkout elements from 23.48 (US mean) to 12-14 drives up to +35.26% conversion lift."

  - id: "aud-cog-04"
    veto_id: "veto-hidden-mode-klm-tax"
    name: "hidden_persistent_mode_and_klm_overhead"
    category: "cognitive_load"
    severity: "hard_veto"
    core_invariant: "No persistent hidden mode may alter identical user gestures without a focal persistent indicator, and frequent daily workflows (>= 20/day) must not exceed a 3x KLM-GOMS penalty relative to a direct keyboard binding."
    target_antipattern: "Silent toggle states (e.g., Plan vs. Agent or View vs. Edit) mutating Enter/Delete semantics off-locus, or mouse-only cascading menus imposing > 3x KLM time cost (e.g., 5.50 s vs. 1.75 s)."
    detection_rule: "Inspect state machines for persistent mode flags branching keydown handlers without spring-loaded quasimode or focal status indicator, and compute KLM-GOMS (K=0.20s, B=0.10s, H=0.40s, P=1.10s, M=1.35s) on frequent daily actions; FAIL if hidden_mode_present === true OR klm_ratio_vs_shortcut > 3.0."
    threshold: "0 hidden modes AND klm_ratio_vs_shortcut <= 3.0"
    verification_method: "klm_goms_estimate"
    mandatory_remediation: "Replace hidden persistent modes with spring-loaded quasimodes or explicit spatial separation, and bind frequent daily operations to direct keyboard shortcuts or a <= 50 ms Cmd+K palette."
    primary_sources:
      - id: "src-cog-04"
        title: "The Humane Interface: New Directions for Designing Interactive Systems"
        author_or_org: "Jef Raskin"
        year: 2000
        source_type: "book"
        url_or_identifier: "ISBN 978-0-201-37937-2"
        extracted_invariant: "Single locus of attention makes hidden persistent modes inherently error-prone; quasimodes eliminate mode errors."
      - id: "src-cog-05"
        title: "The Keystroke-Level Model for User Performance Time with Interactive Systems"
        author_or_org: "Stuart K. Card, Thomas P. Moran, Allen Newell"
        year: 1980
        source_type: "peer_reviewed_paper"
        url_or_identifier: "Communications of the ACM, Vol. 23, No. 7, pp. 396-410"
        extracted_invariant: "KLM operators (K=0.20s, B=0.10s, H=0.40s, P=1.10s, M=1.35s) quantify mouse menu tax at 5.50 s vs. 1.75 s for keyboard shortcut (3.14x)."
