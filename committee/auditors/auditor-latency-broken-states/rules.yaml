schema_version: "1.0.0"
auditor_slug: "auditor-latency-broken-states"
suite_id: "ui-ux"
mandate: "Block perceptual freezes, main-thread long tasks, unguarded mutations, and incomplete async UI states."
rules:
  - id: "aud-lat-01"
    veto_id: "veto-incomplete-ui-stack"
    name: "scott_hurff_five_state_ui_stack"
    category: "latency_perception"
    severity: "hard_veto"
    core_invariant: "Every async-data-connected view must implement explicit branches for all 5 UI Stack states: Ideal, Blank/Empty, Loading, Partial, and Error."
    target_antipattern: "Components rendering only the happy-path array map while crashing or showing blank white containers on empty arrays, network errors, loading delays, or sparse partial payloads."
    detection_rule: "Inspect conditional render branches on async data hooks (useQuery, useEffect/fetch, IPC loaders); FAIL if any of Ideal, Blank/Empty (items.length === 0), Loading (isLoading), Partial (missing optional/sparse fields), or Error (isError + retry) is absent."
    threshold: "5/5 UI Stack states explicitly handled"
    verification_method: "state_matrix_check"
    mandatory_remediation: "Add deterministic render branches for Loading, Blank/Empty (with primary next action), Partial (graceful fallback per field), and Error (preserving user input with inline retry)."
    primary_sources:
      - id: "src-lat-01"
        title: "Designing Products People Love (The UI Stack)"
        author_or_org: "Scott Hurff"
        year: 2015
        source_type: "book"
        url_or_identifier: "O'Reilly Media, ISBN 978-1-491-92367-2"
        extracted_invariant: "Complete interactive reliability requires explicit design and code handling for Ideal, Blank, Loading, Partial, and Error states."

  - id: "aud-lat-02"
    veto_id: "veto-perceptual-latency-breach"
    name: "rail_inp_and_sequential_await_budget"
    category: "latency_perception"
    severity: "hard_veto"
    conditional_fallback_severity: "conditional_block"
    core_invariant: "Interactive handlers must keep input processing <= 50 ms, initial visual acknowledgment <= 100 ms, and INP p75 <= 200 ms (> 500 ms is a hard_veto); independent critical-path awaits must run via Promise.all."
    target_antipattern: "Synchronous heavy computation blocking pointer/key handlers > 50 ms, unacknowledged clicks > 100 ms, INP p75 > 500 ms, or independent sequential await calls inflating perceived wait by 300-500 ms."
    detection_rule: "Inspect event handlers and telemetry: HARD_VETO if input_processing_ms > 50 OR visual_ack_ms > 100 OR inp_p75_ms > 500; CONDITIONAL_BLOCK if 200 < inp_p75_ms <= 500 OR independent sequential awaits exist in critical-path submit/load handlers without Promise.all."
    threshold: "input <= 50 ms, ack <= 100 ms, INP p75 <= 200 ms (hard fail > 500 ms)"
    verification_method: "static_code_audit"
    mandatory_remediation: "Yield or offload long tasks off the main thread, emit <= 100 ms visual confirmation (optimistic state or pressed/busy indicator), and parallelize independent critical-path requests with Promise.all."
    primary_sources:
      - id: "src-lat-02"
        title: "Measure Performance with the RAIL Model & Interaction to Next Paint (INP)"
        author_or_org: "Google web.dev / Core Web Vitals"
        year: 2024
        source_type: "official_standard"
        url_or_identifier: "https://web.dev/articles/inp"
        extracted_invariant: "Frame budget <= 16.6 ms (<= 10 ms JS), input <= 50 ms, visual response <= 100 ms, INP p75 <= 200 ms good / > 500 ms poor."
      - id: "src-lat-03"
        title: "Usability Engineering (Response Time Limits: 0.1 s, 1 s, 10 s)"
        author_or_org: "Jakob Nielsen"
        year: 1993
        source_type: "book"
        url_or_identifier: "ISBN 978-0-12-518406-9"
        extracted_invariant: "0.1 s feels instantaneous, 1.0 s is the limit for uninterrupted flow of thought, and 10 s is the limit for retaining user attention."

  - id: "aud-lat-03"
    veto_id: "veto-unstreamed-long-wait"
    name: "doherty_nielsen_streaming_and_progress_gate"
    category: "latency_perception"
    severity: "hard_veto"
    core_invariant: "Any async or LLM operation exceeding 400 ms (Doherty practical target) or 1,000 ms (Nielsen flow break) must expose immediate work state (< 100 ms), early streaming or determinate progress, and cancellation."
    target_antipattern: "Awaiting a full multi-second fetch or LLM completion before rendering anything, with no streaming tokens, no stage progress, and no AbortController cancel trigger."
    detection_rule: "Inspect network and LLM invocation paths expected to exceed 400 ms / 1,000 ms; FAIL if response awaits full body without ReadableStream/SSE streaming or visible progress indicator, or lacks AbortController cancellation."
    threshold: "ack <= 100 ms AND first_stream_or_progress <= 400 ms (hard fail > 1,000 ms silent wait)"
    verification_method: "static_code_audit"
    mandatory_remediation: "Render <= 100 ms acknowledgment, stream partial output or deterministic step status within <= 400 ms, and bind an AbortController to a visible Cancel button and Esc key."
    primary_sources:
      - id: "src-lat-04"
        title: "The Economic Value of Rapid Response Time (IBM Technical Report GE20-0752-0)"
        author_or_org: "Walter J. Doherty & Arvind J. Thadhani"
        year: 1982
        source_type: "empirical_benchmark"
        url_or_identifier: "IBM Technical Report GE20-0752-0"
        extracted_invariant: "Sub-second system responses (e.g., 0.3 s vs. 3.0 s) trigger steep non-linear operator productivity gains."

  - id: "aud-lat-04"
    veto_id: "veto-unsafe-mutation-or-double-submit"
    name: "optimistic_rollback_and_double_submit_guard"
    category: "latency_perception"
    severity: "hard_veto"
    core_invariant: "Every optimistic mutation must capture pre-mutation state and execute visible rollback on error, and every submit/mutation button must prevent duplicate in-flight submissions."
    target_antipattern: "Optimistic UI state updates with empty catch blocks leaving phantom data on server failure, or submit buttons lacking disabled/aria-busy/in-flight ref locks so double clicks fire duplicate POST mutations."
    detection_rule: "Inspect optimistic state writers for snapshot capture + catch-branch rollback + user-visible error feedback, and inspect form/action submit handlers for disabled/aria-busy/in-flight lock; FAIL if rollback_on_error === false OR double_submit_guard === false."
    threshold: "deterministic_rollback === true AND double_submit_guard === true"
    verification_method: "state_matrix_check"
    mandatory_remediation: "Snapshot prior state before optimistic writes, restore it with a role='alert'/role='status' retry banner on server error, and guard submit controls with in-flight lock + aria-busy='true' (or idempotency key + disabled state)."
    primary_sources:
      - id: "src-lat-01"
        title: "Designing Products People Love (The UI Stack)"
        author_or_org: "Scott Hurff"
        year: 2015
        source_type: "book"
        url_or_identifier: "O'Reilly Media, ISBN 978-1-491-92367-2"
        extracted_invariant: "Error states must recover gracefully without silent corruption or duplicated user actions."
