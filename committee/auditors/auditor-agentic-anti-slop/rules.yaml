schema_version: "1.0.0"
auditor_slug: "auditor-agentic-anti-slop"
suite_id: "ui-ux"
mandate: "Block unjustified chat fatigue, opaque agent mutations, stacked visual AI slop, and Solow Central Dynamo bolt-on AI wrappers."
rules:
  - id: "aud-slop-01"
    veto_id: "veto-forced-chat-over-direct-controls"
    name: "interactive_ai_chat_slop"
    category: "agentic_trust"
    severity: "hard_veto"
    core_invariant: "Natural-language chat is reserved for open-ended specification; localized edits, filtering, sorting, and finite parameter tuning must use direct manipulation or deterministic controls."
    target_antipattern: "Forcing non-linear editing or finite control adjustments through an unbounded chat box, triggering Accordion Editing and Apple Picking copy-paste loops."
    detection_rule: "Inspect UI components routing localized object edits, table filters, or finite settings exclusively through a free-text LLM prompt box with 0 direct manipulation controls; FAIL if direct_control_absent === true."
    threshold: "localized_or_parametric_edits_via_direct_controls === true"
    verification_method: "static_code_audit"
    mandatory_remediation: "Bind direct object selection, scoped inline commands, or deterministic widgets to localized edits and reserve free-text prompting strictly for open-ended synthesis."
    primary_sources:
      - id: "src-solow-02"
        title: "DirectGPT: A Direct Manipulation Interface to Interact with Large Language Models"
        author_or_org: "Damien Masson, Sylvain Malacria, Géry Casiez, Daniel Vogel"
        year: 2024
        source_type: "peer_reviewed_paper"
        url_or_identifier: "doi:10.1145/3613904.3642462"
        extracted_invariant: "Direct manipulation over the same LLM cut completion time by 50%, prompts by 50%, and prompt length by 72%."

  - id: "aud-slop-02"
    veto_id: "veto-opaque-agent-no-diff-undo"
    name: "opaque_agentic_execution_without_diff_or_undo"
    category: "agentic_trust"
    severity: "hard_veto"
    core_invariant: "Every multi-file or external agentic mutation must expose live execution trajectory, contextual diff preview, and one-step atomic rollback (Undo)."
    target_antipattern: "Autonomous agents mutating workspace files or invoking external tools silently behind a generic spinner with zero tool trace, zero inline diff, and conversational-only undo."
    detection_rule: "Inspect agent runner components and IPC/API mutation hooks: FAIL if live_trajectory_view === false OR contextual_diff_preview === false OR atomic_undo_snapshot === false."
    threshold: "trajectory === true AND diff_preview === true AND atomic_undo === true"
    verification_method: "state_matrix_check"
    mandatory_remediation: "Render live tool/file execution trace, present scoped inline diffs with explicit checkpoints before multi-file/external writes, and persist pre-turn snapshots bound to Cmd/Ctrl+Z rollback."
    primary_sources:
      - id: "src-slop-02"
        title: "Human-Centered AI"
        author_or_org: "Ben Shneiderman"
        year: 2022
        source_type: "book"
        url_or_identifier: "Oxford University Press, ISBN 978-0-19-284529-0"
        extracted_invariant: "Reliable agentic systems combine High Human Control with High Automation via previews, audit trails, and reversible actions."

  - id: "aud-slop-03"
    veto_id: "veto-stacked-visual-ai-slop"
    name: "stacked_generative_visual_slop"
    category: "visual_semiotics"
    severity: "conditional_block"
    core_invariant: "Interfaces must never stack >= 3 unexamined generative visual clichés absent from declared project brand tokens or DESIGN.md."
    target_antipattern: "Stacking default indigo/violet/purple gradients (indigo-500/violet-500/purple-500) outside declared brand tokens, bg-clip-text KPI figures, decorative neon glows, redundant sparkle icons, animations on >100/day shortcuts (Cmd+K), or hover font-weight layout shifts."
    detection_rule: "Check brand_exemption from uiux_cpu_scanner.py first; if declared brand tokens exist, exempt brand-palette gradients. Scan CSS/Tailwind/JSX for remaining slop signals (unbacked default gradients, bg-clip-text on metrics/headings, decorative neon blur glows, unbacked sparkle icons, transition/animation duration > 0 ms on Cmd+K or >100/day actions, hover font-weight shift without width reservation); FAIL if stacked_slop_signals >= 3."
    threshold: "stacked_slop_signals < 3"
    verification_method: "static_code_audit"
    mandatory_remediation: "Strip decorative indigo-purple gradients, bg-clip-text figures, neon blurs, and unbacked sparkles; enforce 0 ms on Cmd+K / >100/day controls and remove hover font-weight shifts."
    primary_sources:
      - id: "src-slop-03"
        title: "The Proliferation and Problem of the Sparkles Icon & Generative UI Homogeneity"
        author_or_org: "Kate Kaplan (Nielsen Norman Group)"
        year: 2024
        source_type: "empirical_benchmark"
        url_or_identifier: "https://www.nngroup.com/articles/ai-sparkles-icon-problem/"
        extracted_invariant: "Unbacked AI sparkle icons and default purple/indigo gradient templates fail icon-comprehension benchmarks and create visual homogeneity across generative UIs."

  - id: "aud-slop-04"
    veto_id: "veto-central-dynamo"
    name: "central_dynamo_bolt_on_ai_test"
    category: "agentic_trust"
    severity: "hard_veto"
    conditional_fallback_severity: "conditional_block"
    solow_classification_output:
      fail_label: "BOLT_ON_CAPITAL_K"
      partial_label: "TRANSITIONAL_HYBRID"
      pass_label: "UNIT_DRIVE_TFP_A"
    core_invariant: "AI capabilities must act as distributed unit-drive motors embedded into the workspace state—eliminating manual articulation steps via shared context, in-place structured diffs, and atomic rollback—never as a disconnected central chat dynamo bolted onto an unchanged legacy workflow."
    target_antipattern: "Bolting a floating 'Ask AI' sparkle button, disconnected sidebar chat drawer, or prose-only LLM modal onto an unmodified legacy form, table, or IDE surface—increasing token spend (K) while forcing manual context re-explanation, Accordion Editing, and copy-paste Apple Picking (zero TFP gain A)."
    deterministic_predicates:
      - predicate_id: "cd-01"
        name: "disconnected_workspace_context"
        weight: "critical"
        verification_method: "static_code_audit"
        detection_rule: "Inspect LLM request payloads (fetch, axios, SDK calls, Electron IPC invoke) inside AI components: FAIL if payload contains only raw user prompt strings from a local input/textarea state and injects 0 live workspace references (active selection range, focused entity ID, current form/filter state, or open document buffer)."
        pass_condition: "workspace_context_bindings_count >= 1 AND auto_captured_without_user_retyping === true"
      - predicate_id: "cd-02"
        name: "prose_only_copy_paste_output_bridge"
        weight: "critical"
        verification_method: "state_matrix_check"
        detection_rule: "Inspect LLM response renderers and action handlers: FAIL if model output renders exclusively as scrolling chat bubbles or markdown blocks whose primary transfer mechanism to the legacy surface is navigator.clipboard.writeText / manual copy-paste, with 0 structured apply handlers (onApplyDiff, onPatchEntity, onFillStructuredFields) wired to an atomic Undo stack."
        pass_condition: "inline_structured_apply_handler_present === true AND atomic_undo_bound === true"
      - predicate_id: "cd-03"
        name: "zero_legacy_step_elimination"
        weight: "high"
        verification_method: "klm_goms_estimate"
        detection_rule: "Compare pre-AI and post-AI interaction graph on the target surface: FAIL if 100% of legacy form inputs, sequential navigation clicks, or manual filter/submit gates remain untouched while the AI addition merely appends a new chat entry point that adds KLM operators (M + P + B + typing) to complete the primary task."
        pass_condition: "legacy_steps_or_fields_eliminated >= 1 OR klm_task_time_reduction_pct >= 25"
      - predicate_id: "cd-04"
        name: "unstructured_prompt_over_finite_controls"
        weight: "high"
        verification_method: "static_code_audit"
        detection_rule: "Inspect task scope bound to free-text prompt boxes: FAIL if an unbounded <textarea>/<input> prompt is the primary mechanism for localized edits, structured record filtering, sorting, or finite parameter adjustments where direct manipulation, selection-scoped commands, or deterministic widgets apply."
        pass_condition: "localized_or_parametric_edits_use_direct_controls === true"
    firing_thresholds:
      hard_veto_condition: "(failed_predicates_count >= 3) OR (cd-01 == FAIL AND cd-02 == FAIL)"
      conditional_block_condition: "failed_predicates_count == 2 AND NOT hard_veto_condition"
      pass_condition: "failed_predicates_count <= 1 AND cd-01 == PASS AND cd-02 == PASS"
    exemptions:
      - exemption_id: "ex-01"
        condition: "Surface is an explicitly scoped open-ended synthesis, multi-document research, or unconstrained exploratory drafting workspace where user intent cannot be bounded to finite UI parameters."
        mandatory_guardrails_still_required:
          - "Must still pass cd-01 (automatic attachment of active workspace scope/documents) when operating inside an existing project."
          - "Must expose source provenance, streaming status <= 400 ms, and direct export/insertion without manual clipboard round-trips."
    mandatory_remediation:
      - step: 1
        action: "Eliminate disconnected chat sidebars for task-specific workflows; bind the AI invocation directly to the active DOM selection, form model, or document coordinate (Flow Awareness)."
      - step: 2
        action: "Replace prose-only LLM outputs with structured, schema-validated patches or inline diffs rendered directly in place over the target object, paired with 1-click Accept/Reject and Cmd/Ctrl+Z atomic rollback."
      - step: 3
        action: "Delete redundant legacy form fields, manual filter steps, or copy-paste handoffs superseded by the embedded AI primitive so net KLM task time drops by >= 25%."
    applies_to_regimes:
      - "ai_native_desktop_ide"
      - "saas_b2b_intensive"
      - "mobile_consumer_capture"
      - "analytics_dense_telemetry"
      - "landing_onboarding_conversion"
    activation_condition: "Run unconditionally whenever the inspected artifact contains any LLM API/IPC call, streaming response handler, prompt input, or AI-labeled UI trigger."
    primary_sources:
      - id: "src-solow-01"
        title: "The Dynamo and the Computer: An Historical Perspective on the Modern Productivity Paradox"
        author_or_org: "Paul A. David"
        year: 1990
        source_type: "peer_reviewed_paper"
        url_or_identifier: "American Economic Review, Vol. 80, No. 2, pp. 355-361"
        extracted_invariant: "Direct substitution of a General Purpose Technology into legacy layouts (central electric dynamo over shaft-and-belt factories, 1880-1910) raises capital input (K) without lifting Total Factor Productivity (A); sustained productivity gains emerge only after unit-drive workflow redesign (1920s)."
      - id: "src-solow-02"
        title: "DirectGPT: A Direct Manipulation Interface to Interact with Large Language Models"
        author_or_org: "Damien Masson, Sylvain Malacria, Géry Casiez, Daniel Vogel"
        year: 2024
        source_type: "peer_reviewed_paper"
        url_or_identifier: "doi:10.1145/3613904.3642462"
        extracted_invariant: "Embedding direct object selection, reusable scoped commands, and Undo/Redo over the same underlying LLM made users 50% faster with 50% fewer prompts and 72% shorter prompts than a standalone chat interface."
      - id: "src-solow-03"
        title: "AI Paradigm Shifts in Interaction: Accordion Editing and Apple Picking in Linear Chat UIs"
        author_or_org: "Nielsen Norman Group"
        year: 2024
        source_type: "empirical_benchmark"
        url_or_identifier: "NN/g Empirical UX Study (Jan 2024) on Linear Chat Friction"
        extracted_invariant: "Forcing non-linear editing workflows into linear chat boxes induces Accordion Editing and manual Apple Picking copy-paste loops that break user flow."
      - id: "src-solow-04"
        title: "Why Johnny Can't Prompt: How Non-AI Experts Try (and Fail) to Design LLM Prompts"
        author_or_org: "J.D. Zamfirescu-Pereira, Richmond Y. Wong, Bjoern Hartmann, Qian Yang"
        year: 2023
        source_type: "peer_reviewed_paper"
        url_or_identifier: "ACM CHI 2023 Proceedings"
        extracted_invariant: "Open-ended free-text prompting imposes severe articulation overhead on non-expert operators compared to structured, constrained interaction surfaces."
